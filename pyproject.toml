[project]
name = "playwright-workflows"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinay Kumar", email = "vinaymavi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.65.1",
    "prefect>=3.9.2",
    "prefect-gcp>=0.6.22",
    "pytesseract>=0.3.13",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
playwright-workflows = "cli.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["browser", "cli", "flow", "task", "util"]
